services:
  bot:
    build: .
    container_name: sto-content-bot
    env_file: .env
    environment:
      # Внутри контейнера health-сервер слушает этот порт
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status==200 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
