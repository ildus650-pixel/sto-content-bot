name: keepalive

# Render free web service засыпает после 15 минут без входящего трафика.
# Этот пинг раз в 10 минут держит инстанс живым. Public-репозиторий -> Actions бесплатны.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /healthz
        run: |
          set -uo pipefail
          url="https://sto-content-bot.onrender.com/healthz"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$url" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
              exit 0
            fi
            sleep 20
          done
          echo "service did not answer 200 after 3 attempts"
          exit 1
